name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest app/tests -q
        env:
          DATABASE_URL: sqlite:///./test_localhands.db
          JWT_SECRET_KEY: "ci-secret-key-that-is-long-enough-for-testing-only"
          ENVIRONMENT: development
      - name: SAST with Bandit
        working-directory: backend
        run: |
          pip install bandit
          bandit -r app -ll -q
      - name: Dependency vulnerability scan (SCA)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit
      - name: Migration validation
        working-directory: backend
        run: |
          python -m alembic history || echo "no migrations to validate"

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web deps
        working-directory: web-app
        run: npm ci || npm install
      - name: Build web
        working-directory: web-app
        run: npm run build
      - name: Web lint
        working-directory: web-app
        run: npm run lint || true

  mobile-typecheck:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install mobile deps
        working-directory: mobile-app
        run: npm ci || npm install
      - name: Typecheck mobile
        working-directory: mobile-app
        run: npx tsc --noEmit

  docker-image-scan:
    name: Docker image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan backend Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "backend"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
